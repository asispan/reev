name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned native deps (checksum-verified)
        run: ./tools/fetch_deps.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      - name: Release build refuses to sign without the upload key
        run: |
          set +e
          out=$(./gradlew --no-daemon assembleRelease 2>&1)
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "Release signing credentials are required" <<<"$out"

      - name: Signed, minified release builds (throwaway keystore)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-pass-123 -keypass ci-pass-123 \
            -alias reev-upload -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci
          REEV_KEYSTORE="$RUNNER_TEMP/ci.jks" REEV_KEYSTORE_PASSWORD=ci-pass-123 ./gradlew --no-daemon assembleRelease
          # Release must carry no transcript/debug logging strings.
          unzip -p app/build/outputs/apk/release/app-release.apk 'classes*.dex' | strings | { ! grep -E "decoded .* pts|<- .* chars"; }
